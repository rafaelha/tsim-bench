arxiv = "2503.18657"

[circuits."rp_3_T_cult"]
num_detectors = 44
postselect = "all"
reason = "Ungrown MSC-3 cultivation uses full postselection, discarding any shot that triggers a detector (Tab. I caption, Sec. I); this includes the appended noiseless SE round and logical readout (stage 5), which the paper defines as part of the ungrown benchmark. Every detector carries the generator's 4th (stage) coordinate, the t_gadget.py marker for postselected detectors."
detector_reference = true  # the cultivation checks include detectors that are deterministically 1 without noise (e.g. 13, 15-17)

