[project]
name = "tsim-active-width"
version = "0.1.0"
description = "Literature survey of Stim circuits with non-Clifford gates and their active widths in Tsim and Clifft"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bloqade-tsim",
    "clifft==0.12.0",
    "stim",
    "numpy",
    "sinter>=1.16.0",
    "networkx>=3.7",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "pymatching>=2.4.0",
    "pygltflib>=1.16.5",
    "chromobius>=1.1.1",
    "igraph>=1.0.0",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Tsim main at 883d787 (2026-10-29).
bloqade-tsim = { git = "https://github.com/QuEraComputing/tsim", rev = "883d787" }
